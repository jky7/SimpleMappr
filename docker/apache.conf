ServerName localhost
ServerTokens Prod
ServerSignature Off
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" simplemappr

<VirtualHost *:80>
    DocumentRoot /srv/simplemappr/docker/public
    <Directory /srv/simplemappr/docker/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>
    RewriteEngine On
    RewriteRule ^/public/tmp/preview-[0-9a-f]{32}\.(png|jpg|svg|tif)$ /index.php [PT,L]
    Alias /public/ /srv/simplemappr/public/
    <Directory /srv/simplemappr/public>
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /srv/simplemappr/public/uploads>
        Require all denied
    </Directory>
    Alias /_runtime /srv/simplemappr/Tests/smoke/http.php
    <Directory /srv/simplemappr/Tests/smoke>
        Require all denied
        <Files http.php>
            Require all granted
        </Files>
    </Directory>
    Alias /_checks/ /var/lib/simplemappr/checks/
    <Directory /var/lib/simplemappr/checks>
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all denied
        <FilesMatch "^(native-(baseline|lambert)\.(png|svg|tif)|report\.json)$">
            Require all granted
            SetHandler None
        </FilesMatch>
    </Directory>
    <Directory /srv/simplemappr>
        AllowOverride None
        Require all denied
    </Directory>
    Header always set X-Content-Type-Options nosniff
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 simplemappr
</VirtualHost>
