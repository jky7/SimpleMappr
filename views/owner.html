{% extends "base.html" %}
{% block meta %}
<meta name="robots" content="noindex, nofollow, noarchive">
{% endblock meta %}
{% block content %}
<main class="page page-narrow">
<div class="card">
<h1>{{ "Local owner"|trans }}</h1>
<div class="card-body">
{% if login_error %}<p role="alert">{{ login_error }}</p>{% endif %}
<form action="{{ base }}/session" method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
<input type="hidden" name="locale" value="{{ locale }}">
<label for="username">{{ "Username"|trans }}</label>
<input id="username" name="username" autocomplete="username" required maxlength="50">
<label for="password">{{ "Password"|trans }}</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="block primary" type="submit">{{ "Sign In"|trans }}</button>
</form>
</div>
<p class="card-footer"><a href="{{ base }}/">{{ "Return to the map editor"|trans }}</a></p>
</div>
</main>
{% endblock %}
