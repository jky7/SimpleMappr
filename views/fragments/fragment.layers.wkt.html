{% for i in 0..2 %}
    {% set d = loop.index %}
    <div class="form-item fieldset-wkt">
    <button class="sprites-before removemore negative" data-type="wkt">{{ "Remove"|trans }}</button>
    <h3><a href="#">{{ "Drawing %d%"|trans({"%d%": d}) }}</a></h3>
    <div>
    <div class="fieldset-taxon">
    <label class="fieldset-title" data-field="title">{{ "Legend"|trans }}<span class="required">*</span>:</label> <input type="text" class="m-mapTitle" size="60" maxlength="60" name="wkt[{{ i }}][title]" />
    </div>
    <div class="resizable-textarea">
    <label class="visually-hidden" data-field="data">{{ "Map data"|trans }} {{ d }}</label><span><textarea class="resizable m-mapCoord" rows="5" cols="60" name="wkt[{{ i }}][data]"></textarea></span>
    </div>
    <div class="fieldset-extras">
    <label class="fieldset-title" data-field="color">{{ "Color"|trans }}:</label> <input type="text" class="colorPicker" size="12" maxlength="11" name="wkt[{{ i }}][color]" value="150 150 150" /> <label class="fieldset-title" data-field="border">{{ "Border"|trans }}</label> <input class="m-mapBorder" type="checkbox" name="wkt[{{ i }}][border]" checked /> <label class="fieldset-title" data-field="hatch">{{ "Hatched"|trans }}</label> <input class="m-mapHatch" type="checkbox" name="wkt[{{ i }}][hatch]" />
    </div>
    <button class="sprites-before clear clearself negative">{{ "Clear"|trans }}</button>
    </div>
    </div>
{% endfor %}
