{% for i in 0..2 %}
    {% set d = loop.index %}
     <div class="form-item fieldset-points">
     <button class="sprites-before removemore negative" data-type="coords">{{ "Remove"|trans }}</button>
     <h3><a href="#">{{ "Layer %d%"|trans({"%d%": d}) }}</a></h3>
     <div>
     <div class="fieldset-taxon">
     <label class="fieldset-title" data-field="title">{{ "Legend"|trans }}<span class="required">*</span>:</label> <input type="text" class="m-mapTitle" size="60" maxlength="60" name="coords[{{ i }}][title]" />
     </div>
     <div class="resizable-textarea">
     <label class="visually-hidden" data-field="data">{{ "Map data"|trans }} {{ d }}</label><span><textarea class="resizable m-mapCoord" rows="5" cols="60" name="coords[{{ i }}][data]"></textarea></span>
     </div>
     <div class="fieldset-extras">
     <label class="fieldset-title" data-field="shape">{{ "Shape"|trans }}</label> <select class="m-mapShape" name="coords[{{ i }}][shape]">{% include 'fragments/fragment.marker.shape.html' %}</select> <label class="fieldset-title" data-field="size">{{ "Size"|trans }}</label> <select class="m-mapSize" name="coords[{{ i }}][size]">{% include 'fragments/fragment.marker.size.html' %}</select>
     <label class="fieldset-title" data-field="color">{{ "Color"|trans }}</label> <input class="colorPicker" type="text" size="12" maxlength="11" name="coords[{{ i }}][color]" value="0 0 0" /> <label class="fieldset-title" data-field="shadow">{{ "Shadow"|trans }}</label> <input class="m-mapShadow" type="checkbox" name="coords[{{ i }}][shadow]" />
     </div>
     <button class="sprites-before clear clearself negative">{{ "Clear"|trans }}</button>
     </div>
     </div>
{% endfor %}
