    <script type="text/template" id="dialog-template">
    <div id="mapper-message" class="ui-state-error" title="{{ "Warning"|trans }}"></div>
    <div id="button-titles" class="hidden-message">
      <span class="save">{{ "Save"|trans }}</span>
      <span class="cancel">{{ "Cancel"|trans }}</span>
      <span class="download">{{ "Download"|trans }}</span>
      <span class="delete">{{ "Delete"|trans }}</span>
    </div>
    <div id="mapper-loading-error-message" class="hidden-message">{{ "There was a problem loading your map."|trans }}</div>
    <div id="mapper-saving-error-message" class="hidden-message">{{ "There was a problem saving your map."|trans }}</div>
    <div id="mapper-download-error-message" class="hidden-message">{{ "The download failed or exceeded 90 seconds. Your map is kept. Try again."|trans }}</div>
    <div id="mapper-saving-message" class="hidden-message">{{ "Saving..."|trans }}</div>
    <div id="mapper-missing-legend" class="hidden-message">{{ "You are missing a legend for at least one of your Point Data, Region, or Drawing layers."|trans }}</div>
    <div id="mapper-message-delete" class="ui-state-highlight hidden-message" title="{{ "Delete"|trans }}">{{ "Are you sure you want to delete"|trans }} <span></span>?</div>
    <div id="mapper-legend-message" class="hidden-message">{{ "legend will appear here"|trans }}</div>
    <div id="mapper-message-help" class="ui-state-highlight hidden-message" title="{{ "Example Coordinates"|trans }}"></div>
    <div id="mapper-message-codes" class="ui-state-highlight hidden-message" title="{{ "State/Province Codes"|trans }}"></div>
    <div id="mapEmbed" class="ui-state-highlight hidden-message" title="{{ "Embed"|trans }}">
      <div class="header"><h2>{{ 'Image'|trans }}</h2></div>
      <p><input id="embed-img" type="text" size="62" value="" /></p>
      <p><strong>{{ "Additional parameters"|trans }}</strong>:<br><span class="indent">{{ "width, height, legend"|trans }} <br><em>e.g.</em> /map/<span class="mid"></span>?width=200&amp;height=150&amp;legend=true</span></p>
      <div class="header"><h2>{{ 'KML'|trans }}</h2></div>
      <p><input id="embed-kml" type="text" size="62" value="" /></p>
      <div class="header"><h2>{{ 'SVG'|trans }}</h2></div>
      <p><input id="embed-svg" type="text" size="62" value="" /></p>
      <div class="header"><h2>{{ 'GeoJSON'|trans }}</h2></div>
      <p><input id="embed-json" type="text" size="62" value="" /></p>
      <p><strong>{{ "Additional parameters"|trans }}</strong>:<br><span class="indent">{{ "callback"|trans }} (<em>e.g.</em> /map/<span class="mid"></span>.json?callback=myCoolCallback)</span></p>
    </div>
    <div id="badFile" title="{{ "Unsupported file type"|trans }}">{{ "Import a supported map data file with valid text encoding. Existing data is kept when import fails."|trans }}</div>
    <div id="tooMuchData" title="{{ "Too many fields of data"|trans }}">{{ "A maximum of %num_textarea% data fields is supported."|trans({"%num_textarea%": num_textarea}) }}</div>
    </script>
