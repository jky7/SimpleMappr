{% if rows %}
<table class="grid-shares"><thead><tr><th>Title</th><th>Shared link</th><th>Created</th></tr></thead><tbody>
{% for row in rows %}<tr><td>{{ row.title }}</td><td><a href="{{ base }}/shared/{{ row.token }}" target="_blank" rel="noopener noreferrer">Open shared map</a></td><td>{{ row.created|date("M d, Y") }}</td></tr>{% endfor %}
</tbody></table>
{% else %}<div class="panel"><p>You have no active public links. Use Share in My Maps to create a revocable link.</p></div>{% endif %}
