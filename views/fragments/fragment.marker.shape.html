<option value="">{{ "--select--"|trans }}</option>
{% for key,value in marker_shapes %}
    {% if key == "general" %}
        {% for key1,value1 in value %}
        <option value="{{ key1 }}">{{ value1['name']|trans }}</option>
        {% endfor %}
    {% endif %}
    {% if key == "closed" %}
    <optgroup label='{{ "solid"|trans }}'>
        {% for key1,value1 in value %}
        <option value="{{ key1 }}"{% if key1 == "circle" %} selected = "selected"{% endif %}>{{ value1['name']|trans }}</option>
        {% endfor %}
    </optgroup>
    {% endif %}
    {% if key == "open" %}
    <optgroup label='{{ "open"|trans }}'>
        {% for key1,value1 in value %}
        <option value="{{ key1 }}">{{ value1['name']|trans }}</option>
        {% endfor %}
    </optgroup>
    {% endif %}
{% endfor %}
