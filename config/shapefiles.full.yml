environments:
    development:
        layers:
            base:
                name: base
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_land'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 4
                color: '10,10,10'
                dynamic_width: true
            countries:
                name: Countries
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_0_map_units'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 4
                color: '10,10,10'
                dynamic_width: true
            stateprovinces:
                name: State/Provinces
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_1_states_provinces_lines'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 6
                color: '10,10,10'
                dynamic_width: true
            stateprovinces_polygon:
                name: State/Provinces
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_1_states_provinces'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 5
            lakesOutline:
                name: 'lakes (outline)'
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_lakes'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 2
                outline_color: '80,80,80'
            lakes:
                name: 'lakes (greyscale)'
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_lakes'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 3
                color: '120,120,120'
            rivers:
                name: rivers
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_rivers_lake_centerlines'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 8
                color: '120,120,120'
            oceans:
                name: 'oceans (greyscale)'
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_ocean'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 3
                color: '220,220,220'
            roads:
                name: roads
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_roads'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 9
                color: '60,60,60'
            railroads:
                name: railroads
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_railroads'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 9
                color: '100,100,100'
            conservation:
                name: 'Biodiversity hotspots (2016.1, CC BY-SA)'
                path: '%%ROOT%%/mapserver/maps/hotspots_2016_1/hotspots_2016_1'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 3
                opacity: 75
                color: '200,200,200'
                outline_color: '30,30,30'
                filter:
                    item: Type
                    equals: 'hotspot area'
                    view: '%%ROOT%%/config/hotspots-2016.vrt'
            ecoregions:
                name: 'RESOLVE ecoregions (2017, CC BY)'
                path: '%%ROOT%%/mapserver/maps/Ecoregions2017/Ecoregions2017'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: CP1252
                sort: 3
                opacity: 75
                class:
                    sld: '%%ROOT%%/config/ecoregions-2017.sld'
                    item: ECO_ID
            relief:
                name: 'Color shaded relief'
                path: '%%ROOT%%/mapserver/maps/HYP_LR_SR_OB_DR/HYP_LR_SR_OB_DR.tif'
                type: '%%MS_LAYER_RASTER%%'
                sort: 1
            reliefalt:
                name: 'Natural Earth II relief'
                path: '%%ROOT%%/mapserver/maps/NE2_LR_LC_SR_W_DR/NE2_LR_LC_SR_W_DR.tif'
                type: '%%MS_LAYER_RASTER%%'
                sort: 1
            blueMarble:
                name: 'Blue Marble'
                path: '%%ROOT%%/config/blue-marble.vrt'
                type: '%%MS_LAYER_RASTER%%'
                sort: 1
            reliefgrey:
                name: 'Gray Earth relief'
                path: '%%ROOT%%/mapserver/maps/GRAY_LR_SR_OB_DR/GRAY_LR_SR_OB_DR.tif'
                type: '%%MS_LAYER_RASTER%%'
                sort: 1
        labels:
            lakenames:
                name: lakes
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_lakes'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 7
                tolerance: 5
                tolerance_units: '%%MS_PIXELS%%'
                label:
                    item: name
                    size: 8
                    position: '%%MS_UR%%'
            hotspotLabels:
                name: 'Biodiversity hotspots (2016.1, CC BY-SA)'
                path: '%%ROOT%%/mapserver/maps/hotspots_2016_1/hotspots_2016_1'
