environments:
    development: &minimal
        layers:
            base:
                name: base
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_land'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 4
                color: '10,10,10'
                dynamic_width: true
            countries:
                name: Countries
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_0_map_units'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 4
                color: '10,10,10'
                dynamic_width: true
            stateprovinces:
                name: State/Provinces
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_1_states_provinces_lines'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 6
                color: '10,10,10'
                dynamic_width: true
            stateprovinces_polygon:
                name: State/Provinces
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_1_states_provinces'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 5
            lakesOutline:
                name: lakes (outline)
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_lakes'
                type: '%%MS_LAYER_LINE%%'
                encoding: UTF-8
                sort: 2
                outline_color: '80,80,80'
            lakes:
                name: lakes (greyscale)
                path: '%%ROOT%%/mapserver/maps/10m_physical/ne_10m_lakes'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 3
                color: '120,120,120'
        labels:
            countrynames:
                name: Countries
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_0_map_units'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 12
                tolerance: 5
                tolerance_units: '%%MS_PIXELS%%'
                label:
                    item: name
                    size: 12
                    position: '%%MS_CC%%'
            stateprovnames:
                name: State/Provinces
                path: '%%ROOT%%/mapserver/maps/10m_cultural/10m_cultural/ne_10m_admin_1_states_provinces'
                type: '%%MS_LAYER_POLYGON%%'
                encoding: UTF-8
                sort: 13
                label:
                    item: name
                    size: 10
                    position: '%%MS_CC%%'

    production: *minimal
    testing: *minimal
